[project]
name = "careerpilot-api"
version = "0.1.0"
description = "CareerPilot API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.21,<1",
    "alembic>=1.16,<2",
    "argon2-cffi>=25,<26",
    "asyncpg>=0.30,<1",
    "email-validator>=2.2,<3",
    "fastapi>=0.116,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<10",
    "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint.per-file-ignores]
"app/auth.py" = ["B008"]
"app/workspaces.py" = ["B008"]
